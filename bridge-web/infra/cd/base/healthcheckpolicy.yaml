apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: xbridge-frontend
  namespace: xbridge-frontend
  labels:
    app.kubernetes.io/name: xbridge-frontend
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        requestPath: /
        port: 4173
  targetRef:
    group: ""
    kind: Service
    name: xbridge-frontend
